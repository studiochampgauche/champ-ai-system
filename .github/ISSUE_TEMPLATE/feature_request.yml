name: Improvement
description: Suggest a focused improvement backed by a real workflow.
title: '[Idea] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and where does the current kit fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like and a small example request or command.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How to verify it
      description: What observable result would demonstrate that this improvement helps?
